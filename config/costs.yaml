# Nifty OPTIONS (buying) on Groww. Every rate carries a source and the date it was checked.
# Groww's own /pricing page has no options section (checked 2026-10-01), so several rates are from
# secondary sources. VERIFY AGAINST THE FIRST REAL GROWW CONTRACT NOTE and update `as_of`.
brokerage_per_order:
  value: 20.0
  unit: INR per executed order
  source_url: https://groww.in/help/payments-&-withdrawals/payments-charges/what-fees-does-groww-charge--58
  as_of: "2026-10-01"
stt_sell_pct_of_premium:
  value: 0.15           # raised from 0.10 in Union Budget 2026, effective 2026-04-01
  unit: pct of sell-side premium
  source_url: https://cleartax.in/s/securities-transaction-tax-stt
  as_of: "2026-10-01"
exchange_txn_pct_of_premium:
  value: 0.03503        # NSE equity options, charged on premium turnover (both legs)
  unit: pct of premium turnover
  source_url: https://www.chittorgarh.com/brokerage_charges/groww/173/
  as_of: "2026-10-01"
sebi_fee_per_crore:
  value: 10.0
  unit: INR per crore of premium turnover
  source_url: https://groww.in/pricing
  as_of: "2026-10-01"
gst_pct:
  value: 18.0           # on brokerage + exchange + SEBI (not on STT / stamp duty)
  unit: pct
  source_url: https://groww.in/help/payments-&-withdrawals/payments-charges/apart-from-brokerage--what-fees-am-i-charged--93
  as_of: "2026-10-01"
stamp_duty_buy_pct:
  value: 0.003
  unit: pct of buy-side premium
  source_url: https://groww.in/help/payments/payments-charges/what-is-stt--22
  as_of: "2026-10-01"
slippage_model:
  kind: cross_spread      # half the bid/ask spread paid on each side
  extra_ticks: 0
