# LLM take/skip SHADOW filter (G1/G2 + the forward tournament).
# Spec: docs/reports/2026-10-03_llm_shadow_filter.md and docs/reports/2026-10-04_forward_tournament.md
# Shadow only: it records a decision next to each paper trade and never changes, delays or blocks one.
#
# Backend (owner decision 2026-10-04): headless Claude Code (`claude -p`) under the owner's Claude subscription.
# No API key and no separate bill — calls count against the plan's usage limits. If a limit is hit, the call is
# recorded as NO_DECISION and paper trading carries on.
enabled: true
model: claude-sonnet-5-5        # owner choice 2026-10-03
timeout_s: 240                  # per call; the engine never waits on it (calls run in a background thread/process)
max_calls_per_day: 20           # protects the plan's usage limits for the owner's own work
claude_path: ""                 # "" = find `claude` on PATH or in ~/.local/bin
usd_inr: 88.0                   # only to show the CLI's *equivalent* cost in the log (not billed)
prompt_version: v2              # changing the prompt text = new version = a new evaluation count (never pooled)
