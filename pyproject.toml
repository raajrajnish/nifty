[project]
name = "tradingagent"
version = "0.1.0"
description = "Agentic intraday Nifty options trading system (paper-first, guardrailed)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.5.6",
    "anthropic>=1.11.0",
]

[project.optional-dependencies]
broker = ["growwapi"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "types-PyYAML",
]

[project.scripts]
tradingagent = "tradingagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "llm: calls the Claude API (costs money; run manually)",
    "live: talks to Groww (run manually)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.importlinter]
root_package = "tradingagent"

[[tool.importlinter.contracts]]
name = "core has no internal dependencies"
type = "forbidden"
source_modules = ["tradingagent.core"]
forbidden_modules = [
    "tradingagent.broker", "tradingagent.ui", "tradingagent.orchestrator",
    "tradingagent.agent", "tradingagent.execution",
]

[[tool.importlinter.contracts]]
name = "UI and agent never touch the broker adapter or auth"
type = "forbidden"
source_modules = ["tradingagent.ui", "tradingagent.agent", "tradingagent.tools"]
forbidden_modules = ["tradingagent.broker.groww_adapter", "tradingagent.broker.auth"]
